<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NVIDIA Chat Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.10.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@13.0.3/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d10;
      --bg-elev: #11151b;
      --bg-elev-2: #161b22;
      --border: #1f2730;
      --border-strong: #2a3340;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --text-faint: #6e7681;
      --accent: #76b900;       /* NVIDIA green */
      --accent-hover: #8fce26;
      --user-bg: #1f2937;
      --user-border: #374151;
      --code-bg: #0d1117;
      --danger: #f85149;
      --warn: #d29922;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.2);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.55;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- Header ---------- */
    header {
      flex: 0 0 auto;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, var(--bg-elev) 0%, var(--bg) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      z-index: 10;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      font-weight: 600; letter-spacing: -0.01em;
    }
    .brand .dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .brand h1 { margin: 0; font-size: 15px; font-weight: 600; }
    .brand small { color: var(--text-dim); font-weight: 400; margin-left: 4px; }

    .controls { display: flex; align-items: center; gap: 10px; }
    .status {
      font-size: 12px; color: var(--text-dim);
      padding: 4px 10px; border-radius: 999px;
      background: var(--bg-elev-2); border: 1px solid var(--border);
      display: inline-flex; align-items: center; gap: 6px;
    }
    .status .pulse {
      width: 6px; height: 6px; border-radius: 50%; background: var(--text-faint);
    }
    .status[data-state="busy"] .pulse { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
    .status[data-state="error"] .pulse { background: var(--danger); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.6); }
    }

    select, .btn {
      background: var(--bg-elev-2);
      color: var(--text);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      font: inherit; font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    select:hover, .btn:hover { border-color: var(--accent); }
    .btn.ghost { background: transparent; }

    /* ---------- Log ---------- */
    .log-wrap { position: relative; flex: 1; min-height: 0; }
    #log {
      position: absolute; inset: 0;
      overflow-y: auto;
      padding: 28px 0 32px;
      overflow-anchor: auto;
    }
    #log::-webkit-scrollbar { width: 10px; }
    #log::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
    #log::-webkit-scrollbar-thumb:hover { background: #3a4554; }

    .empty {
      max-width: 720px; margin: 8vh auto 0; padding: 0 24px;
      text-align: center; color: var(--text-dim);
    }
    .empty h2 {
      margin: 0 0 6px; font-size: 22px; color: var(--text); font-weight: 600;
      letter-spacing: -0.02em;
    }
    .empty p { margin: 0 0 24px; }
    .suggestions {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }
    .suggestions button {
      text-align: left;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: var(--text);
      font: inherit; font-size: 13px;
      cursor: pointer;
      transition: border-color .15s, transform .15s, background .15s;
    }
    .suggestions button:hover {
      border-color: var(--accent); transform: translateY(-1px);
      background: var(--bg-elev-2);
    }

    .turn {
      max-width: 820px; margin: 0 auto;
      padding: 12px 24px;
      display: flex; gap: 14px; align-items: flex-start;
    }
    .avatar {
      flex: 0 0 auto;
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 700;
      user-select: none;
    }
    .turn.user .avatar { background: var(--user-border); color: var(--text); }
    .turn.ai .avatar { background: var(--accent); color: #0a0f00; }
    .turn.error .avatar { background: var(--danger); color: #fff; }

    .bubble {
      flex: 1; min-width: 0;
      padding: 4px 0;
    }
    .meta { font-size: 11px; color: var(--text-faint); margin-bottom: 4px; letter-spacing: .02em; }
    .meta .model-tag {
      background: var(--bg-elev-2); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 4px; color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, monospace; font-size: 10px;
    }

    .content { word-wrap: break-word; overflow-wrap: break-word; }

    /* ---------- Markdown ---------- */
    .content > :first-child { margin-top: 0; }
    .content > :last-child { margin-bottom: 0; }
    .content h1, .content h2, .content h3, .content h4 {
      margin: 1.4em 0 .5em; line-height: 1.3; font-weight: 600;
      letter-spacing: -0.01em;
    }
    .content h1 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
    .content h2 { font-size: 1.3em; }
    .content h3 { font-size: 1.12em; }
    .content h4 { font-size: 1em; }
    .content p { margin: 0 0 .9em; }
    .content ul, .content ol { margin: 0 0 .9em; padding-left: 1.4em; }
    .content li { margin: .2em 0; }
    .content li > p { margin: 0; }
    .content blockquote {
      margin: 0 0 .9em; padding: .4em 1em;
      border-left: 3px solid var(--border-strong);
      color: var(--text-dim); background: var(--bg-elev);
      border-radius: 0 6px 6px 0;
    }
    .content a { color: #58a6ff; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content hr {
      border: 0; border-top: 1px solid var(--border);
      margin: 1.4em 0;
    }
    .content code {
      background: var(--bg-elev-2);
      border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.88em;
    }

    /* Code blocks */
    .code-block {
      position: relative;
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin: 0 0 1em;
      overflow: hidden;
    }
    .code-block .code-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 12px;
      background: var(--bg-elev-2);
      border-bottom: 1px solid var(--border);
      font-size: 11px; color: var(--text-dim);
      font-family: ui-monospace, SFMono-Regular, monospace;
      text-transform: lowercase;
    }
    .code-block .copy-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      padding: 2px 8px; border-radius: 4px;
      cursor: pointer; font-size: 11px;
      transition: background .15s, color .15s, border-color .15s;
    }
    .code-block .copy-btn:hover { background: var(--bg-elev); color: var(--text); border-color: var(--border); }
    .code-block .copy-btn.copied { color: var(--accent); }
    .code-block pre {
      margin: 0;
      padding: 14px 16px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px; line-height: 1.55;
    }
    .code-block pre code { background: transparent; border: 0; padding: 0; font-size: inherit; }

    /* Tables */
    .table-wrap { overflow-x: auto; margin: 0 0 1em; }
    .content table {
      border-collapse: collapse; width: 100%;
      font-size: 0.95em;
      background: var(--bg-elev);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .content th, .content td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }
    .content th {
      background: var(--bg-elev-2);
      font-weight: 600; color: var(--text);
    }
    .content tr:last-child td { border-bottom: 0; }
    .content tr:hover td { background: rgba(255,255,255,0.02); }

    /* User bubble — right aligned, no avatar (ChatGPT style) */
    .turn.user { justify-content: flex-end; }
    .turn.user .avatar { display: none; }
    .turn.user .bubble {
      flex: 0 1 auto;
      max-width: 80%;
      text-align: left;
    }
    .turn.user .bubble .content {
      background: var(--user-bg);
      border: 1px solid var(--user-border);
      padding: 10px 14px;
      border-radius: 16px 16px 4px 16px;
      display: inline-block;
      max-width: 100%;
      text-align: left;
      white-space: pre-wrap;
    }

    /* Reasoning */
    .reasoning {
      margin: 4px 0 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-elev);
      overflow: hidden;
    }
    .reasoning summary {
      cursor: pointer; user-select: none;
      padding: 8px 12px;
      font-size: 12px; color: var(--text-dim);
      display: flex; align-items: center; gap: 8px;
      list-style: none;
    }
    .reasoning summary::-webkit-details-marker { display: none; }
    .reasoning summary::before {
      content: '▸'; transition: transform .15s; display: inline-block;
      font-size: 10px; color: var(--text-faint);
    }
    .reasoning[open] summary::before { transform: rotate(90deg); }
    .reasoning summary:hover { color: var(--text); }
    .reasoning .body {
      padding: 0 12px 10px 30px;
      font-size: 12.5px; color: var(--text-dim);
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, monospace;
      max-height: 320px; overflow-y: auto;
    }

    /* Cursor */
    .streaming .content::after {
      content: '▍';
      color: var(--accent);
      animation: blink 1s steps(1) infinite;
      margin-left: 2px;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* Error bubble */
    .turn.error .content {
      background: rgba(248, 81, 73, 0.08);
      border: 1px solid rgba(248, 81, 73, 0.3);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: #ffb3b0;
    }
    .turn.error .content strong { color: var(--danger); }

    /* Scroll-to-bottom */
    .scroll-btn {
      position: absolute;
      bottom: 16px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--bg-elev-2);
      border: 1px solid var(--border-strong);
      color: var(--text);
      padding: 6px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      box-shadow: var(--shadow);
      opacity: 0; pointer-events: none;
      transition: opacity .15s, transform .15s;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .scroll-btn.show { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }
    .scroll-btn:hover { border-color: var(--accent); }

    /* ---------- Composer ---------- */
    form {
      flex: 0 0 auto;
      padding: 12px 20px 18px;
      background: linear-gradient(180deg, transparent 0%, var(--bg) 30%);
    }
    .composer {
      max-width: 820px; margin: 0 auto;
      background: var(--bg-elev);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 8px 8px 8px 14px;
      display: flex; align-items: flex-end; gap: 8px;
      transition: border-color .15s, box-shadow .15s;
    }
    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(118,185,0,0.12);
    }
    textarea {
      flex: 1;
      resize: none;
      min-height: 28px; max-height: 200px;
      padding: 8px 0;
      background: transparent;
      color: var(--text);
      border: 0; outline: 0;
      font: inherit;
      line-height: 1.5;
    }
    textarea::placeholder { color: var(--text-faint); }
    .send {
      flex: 0 0 auto;
      width: 36px; height: 36px;
      background: var(--accent); color: #0a0f00;
      border: 0; border-radius: 10px;
      cursor: pointer;
      display: grid; place-items: center;
      transition: background .15s, transform .15s;
    }
    .send:hover { background: var(--accent-hover); }
    .send:disabled { background: var(--border-strong); color: var(--text-faint); cursor: not-allowed; }
    .send svg { width: 18px; height: 18px; }
    .hint {
      max-width: 820px; margin: 6px auto 0;
      text-align: center; color: var(--text-faint); font-size: 11px;
    }
    .hint kbd {
      background: var(--bg-elev-2); border: 1px solid var(--border);
      border-radius: 3px; padding: 0 5px; font-size: 10px;
      font-family: ui-monospace, monospace;
    }

    @media (max-width: 640px) {
      header { padding: 10px 14px; }
      .turn { padding: 10px 14px; }
      .controls .status { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="dot"></span>
      <h1>NVIDIA Chat <small>· assistant</small></h1>
    </div>
    <div class="controls">
      <div class="status" id="status" data-state="idle"><span class="pulse"></span><span id="statusText">ready</span></div>
      <select id="model" title="Choose model">
        <option value="google/gemma-2-2b-it">google/gemma-2-2b-it</option>
        <option value="google/gemma-3n-e4b-it">google/gemma-3n-e4b-it</option>
        <option value="openai/gpt-oss-20b">openai/gpt-oss-20b</option>
        <option value="openai/gpt-oss-120b">openai/gpt-oss-120b</option>
      </select>
      <button id="reset" class="btn ghost" type="button" title="Clear conversation">New chat</button>
    </div>
  </header>

  <div class="log-wrap">
    <div id="log">
      <div class="empty" id="empty">
        <h2>How can I help today?</h2>
        <p>Pick a model above and ask anything. The conversation stays private to this tab.</p>
        <div class="suggestions">
          <button data-prompt="Generate a basic Express app server in TypeScript.">⚡ Express app in TypeScript</button>
          <button data-prompt="Explain async/await in JavaScript with examples.">📚 Explain async/await</button>
          <button data-prompt="Compare REST, GraphQL, and gRPC in a table.">📊 REST vs GraphQL vs gRPC</button>
          <button data-prompt="Write a Python script that watches a folder for new files.">🐍 Python file watcher</button>
        </div>
      </div>
    </div>
    <button id="scrollBtn" class="scroll-btn" type="button" title="Scroll to bottom">↓ New messages</button>
  </div>

  <form id="form">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Send a message..."></textarea>
      <button id="send" class="send" type="submit" title="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l14 0M13 6l6 6-6 6"/></svg>
      </button>
    </div>
    <div class="hint">Press <kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> for newline</div>
  </form>

  <script>
    // ---------- Marked + highlight.js ----------
    marked.setOptions({ gfm: true, breaks: false });

    // ---------- State ----------
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const resetBtn = document.getElementById('reset');
    const modelSel = document.getElementById('model');
    const emptyEl = document.getElementById('empty');
    const scrollBtn = document.getElementById('scrollBtn');

    const history = [];
    let stickToBottom = true;
    let busy = false;
    let abortCtrl = null;

    // ---------- Utilities ----------
    function setStatus(state, text) {
      status.dataset.state = state;
      statusText.textContent = text;
    }

    function isNearBottom() {
      return log.scrollHeight - log.scrollTop - log.clientHeight < 80;
    }
    function maybeScroll() {
      if (stickToBottom) log.scrollTop = log.scrollHeight;
    }

    log.addEventListener('scroll', () => {
      stickToBottom = isNearBottom();
      scrollBtn.classList.toggle('show', !stickToBottom);
    });
    scrollBtn.addEventListener('click', () => {
      stickToBottom = true;
      log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
    });

    // Auto-grow textarea + enable/disable send
    function autoSize() {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 200) + 'px';
      sendBtn.disabled = !input.value.trim() || busy;
    }
    input.addEventListener('input', autoSize);
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) form.requestSubmit();
      }
    });

    // ---------- Reasoning parser ----------
    // Splits raw stream containing optional <think>...</think> markers into
    // { reasoning, content } strings (concatenated across multiple blocks).
    function parseStream(raw) {
      let reasoning = '';
      let content = '';
      let i = 0;
      while (i < raw.length) {
        const open = raw.indexOf('<think>', i);
        if (open === -1) { content += raw.slice(i); break; }
        if (open > i) content += raw.slice(i, open);
        const close = raw.indexOf('</think>', open + 7);
        if (close === -1) { reasoning += raw.slice(open + 7); break; }
        reasoning += raw.slice(open + 7, close);
        i = close + 8;
      }
      return { reasoning, content };
    }

    // ---------- Rendering ----------
    function renderMarkdown(targetEl, mdText) {
      const html = marked.parse(mdText || '');
      targetEl.innerHTML = DOMPurify.sanitize(html, { ADD_ATTR: ['target', 'rel'] });

      // Wrap tables for horizontal scroll
      targetEl.querySelectorAll('table').forEach(t => {
        if (t.parentElement && t.parentElement.classList.contains('table-wrap')) return;
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        t.parentNode.insertBefore(wrap, t);
        wrap.appendChild(t);
      });

      // External links open in new tab
      targetEl.querySelectorAll('a[href^="http"]').forEach(a => {
        a.target = '_blank'; a.rel = 'noopener noreferrer';
      });

      // Enhance code blocks
      targetEl.querySelectorAll('pre').forEach(pre => {
        if (pre.parentElement && pre.parentElement.classList.contains('code-block')) return;
        const codeEl = pre.querySelector('code');
        const lang = (codeEl && codeEl.className.match(/language-([\w-]+)/) || [])[1] || 'text';
        const block = document.createElement('div');
        block.className = 'code-block';
        const head = document.createElement('div');
        head.className = 'code-head';
        const langSpan = document.createElement('span');
        langSpan.textContent = lang;
        const copy = document.createElement('button');
        copy.className = 'copy-btn';
        copy.type = 'button';
        copy.textContent = 'Copy';
        copy.addEventListener('click', () => {
          const text = codeEl ? codeEl.innerText : pre.innerText;
          navigator.clipboard.writeText(text).then(() => {
            copy.textContent = '✓ Copied';
            copy.classList.add('copied');
            setTimeout(() => { copy.textContent = 'Copy'; copy.classList.remove('copied'); }, 1500);
          }).catch(() => { copy.textContent = 'Copy failed'; });
        });
        head.appendChild(langSpan);
        head.appendChild(copy);
        pre.parentNode.insertBefore(block, pre);
        block.appendChild(head);
        block.appendChild(pre);

        if (codeEl) {
          try {
            if (lang !== 'text' && hljs.getLanguage(lang)) {
              codeEl.innerHTML = hljs.highlight(codeEl.textContent, { language: lang, ignoreIllegals: true }).value;
            } else {
              codeEl.innerHTML = hljs.highlightAuto(codeEl.textContent).value;
            }
            codeEl.classList.add('hljs');
          } catch (e) { /* leave plain */ }
        }
      });
    }

    function addTurn(role, content, modelTag) {
      if (emptyEl && emptyEl.parentElement) emptyEl.remove();
      const turn = document.createElement('div');
      turn.className = 'turn ' + role;

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.textContent = role === 'user' ? 'You' : role === 'error' ? '!' : 'AI';
      turn.appendChild(avatar);

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (role === 'ai' && modelTag) {
        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.innerHTML = `<span class="model-tag">${modelTag}</span>`;
        bubble.appendChild(meta);
      }

      let reasoningEl = null;
      let reasoningBody = null;
      if (role === 'ai') {
        reasoningEl = document.createElement('details');
        reasoningEl.className = 'reasoning';
        reasoningEl.hidden = true;
        const summary = document.createElement('summary');
        summary.innerHTML = '<span>Thinking</span>';
        reasoningBody = document.createElement('div');
        reasoningBody.className = 'body';
        reasoningEl.appendChild(summary);
        reasoningEl.appendChild(reasoningBody);
        bubble.appendChild(reasoningEl);
      }

      const contentEl = document.createElement('div');
      contentEl.className = 'content';
      if (role === 'user' || role === 'error') {
        contentEl.textContent = content || '';
      } else {
        contentEl.textContent = '';
      }
      bubble.appendChild(contentEl);
      turn.appendChild(bubble);
      log.appendChild(turn);
      maybeScroll();

      return { turn, contentEl, reasoningEl, reasoningBody };
    }

    // ---------- Send ----------
    async function ask(message) {
      if (busy) return;
      busy = true;
      sendBtn.disabled = true;
      setStatus('busy', 'thinking…');

      addTurn('user', message);
      history.push({ role: 'user', content: message });

      const model = modelSel.value;
      const aiTurn = addTurn('ai', '', model);
      aiTurn.turn.classList.add('streaming');

      abortCtrl = new AbortController();
      let raw = '';
      let gotFirstToken = false;

      try {
        const res = await fetch('/api/askAI', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history, model, stream: true }),
          signal: abortCtrl.signal,
        });

        if (!res.ok) {
          let detail = '';
          try { const j = await res.json(); detail = j.detail || j.error || ''; }
          catch { detail = await res.text().catch(() => ''); }
          throw new Error(`HTTP ${res.status}${detail ? ' — ' + detail : ''}`);
        }
        if (!res.body) throw new Error('No response stream.');

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        setStatus('busy', 'streaming…');

        let renderPending = false;
        const scheduleRender = () => {
          if (renderPending) return;
          renderPending = true;
          requestAnimationFrame(() => {
            renderPending = false;
            const { reasoning, content } = parseStream(raw);
            if (reasoning) {
              aiTurn.reasoningEl.hidden = false;
              aiTurn.reasoningBody.textContent = reasoning;
            }
            // Anchor: if scrolled up, preserve distance from bottom across innerHTML swap
            const anchorFromBottom = stickToBottom ? null : (log.scrollHeight - log.scrollTop);
            renderMarkdown(aiTurn.contentEl, content);
            if (anchorFromBottom !== null) {
              log.scrollTop = log.scrollHeight - anchorFromBottom;
            } else {
              log.scrollTop = log.scrollHeight;
            }
          });
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          raw += decoder.decode(value, { stream: true });
          if (!gotFirstToken && raw.trim()) gotFirstToken = true;
          scheduleRender();
        }
        // Final flush to ensure last chunk renders
        await new Promise(r => requestAnimationFrame(r));

        const finalParsed = parseStream(raw);
        const finalText = (finalParsed.content || '').trim();
        if (!finalText && !finalParsed.reasoning) {
          aiTurn.contentEl.innerHTML = '<em style="color:var(--text-faint)">(empty response)</em>';
        }
        if (finalText) {
          history.push({ role: 'assistant', content: finalText });
        }
        setStatus('idle', 'ready');
      } catch (err) {
        aiTurn.turn.remove();
        const isAbort = err && err.name === 'AbortError';
        addTurn('error', isAbort ? 'Request cancelled.' : ('Error: ' + (err && err.message || 'unknown')));
        setStatus('error', isAbort ? 'cancelled' : 'error');
      } finally {
        aiTurn.turn.classList.remove('streaming');
        busy = false;
        abortCtrl = null;
        autoSize();
        input.focus();
      }
    }

    // ---------- Events ----------
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text || busy) return;
      input.value = '';
      autoSize();
      ask(text);
    });

    resetBtn.addEventListener('click', () => {
      if (busy && abortCtrl) abortCtrl.abort();
      history.length = 0;
      log.innerHTML = '';
      log.appendChild(emptyEl.cloneNode(true));
      bindEmpty();
      setStatus('idle', 'ready');
      input.focus();
    });

    function bindEmpty() {
      document.querySelectorAll('.suggestions button').forEach(b => {
        b.addEventListener('click', () => {
          input.value = b.dataset.prompt || b.textContent;
          autoSize();
          form.requestSubmit();
        });
      });
    }
    bindEmpty();

    autoSize();
    input.focus();
  </script>
</body>
</html>
